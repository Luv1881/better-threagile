name: Security Static Analysis

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 0 1 * *'

jobs:
  analyze:
    name: GoSec
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Run Gosec
        uses: securego/gosec@f1c81de5fcdf7b466b229fb24ca02d1a8406dd09 # master, pinned 2026-06-12
        with:
          # G304 (file path from variable) is an accepted pattern in this CLI
          # tool; mirrors the gosec exclusion in .golangci.yml.
          args: -exclude=G304 ./...
